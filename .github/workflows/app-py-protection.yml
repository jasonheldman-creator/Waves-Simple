# Workflow for App Protection

name: App Protection

on:
  push:
    branches:
      - main

jobs:
  regression_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Structural validation
        run: |
          if [ ! -f app.py ]; then
            echo 'app.py does not exist';
            exit 1;
          fi
          if [ ! -f app_min.py ]; then
            echo 'app_min.py does not exist';
            exit 1;
          fi
          if ! grep -q '\bimport app_min\b' app.py && ! grep -q '\bdelegate app_min\b' app.py; then
            echo 'app.py must import or delegate to app_min.py';
            exit 1;
          fi
          echo 'Structural validation passed.';